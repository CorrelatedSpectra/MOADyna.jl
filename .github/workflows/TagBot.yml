name: TagBot

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

concurrency:
  group: tagbot
  cancel-in-progress: false

jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LC_ALL: C
    steps:
      - name: Record existing tags
        id: tags
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" \
            --jq '.[].name | select(startswith("v"))' |
            sort > "$RUNNER_TEMP/tagbot-tags-before"
      - uses: JuliaRegistries/TagBot@ffef3282bcacf1055e4d621a5c010959dfbe59ff # v1.25.13
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          changelog: |
            {% if custom %}
            {{ custom }}
            {% else %}
            See the [changelog](https://github.com/CorrelatedSpectra/MOADyna.jl/blob/{{ version }}/CHANGELOG.md) for changes.
            {% endif %}
      # Tags created with GITHUB_TOKEN need explicit workflow dispatches.
      - name: Run tag CI and documentation
        if: ${{ !cancelled() && steps.tags.outcome == 'success' }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" \
            --jq '.[].name | select(startswith("v"))' |
            sort > "$RUNNER_TEMP/tagbot-tags-after"
          comm -13 "$RUNNER_TEMP/tagbot-tags-before" "$RUNNER_TEMP/tagbot-tags-after" |
            while IFS= read -r tag; do
              for workflow in ci.yml docs.yml; do
                gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$tag"
              done
            done
