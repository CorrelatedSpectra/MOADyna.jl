name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the suite only needs to read the repository.
permissions:
  contents: read

# Superseded pull-request runs are cancelled. For main and tags an
# in-progress run is always allowed to finish; a newer pending run may
# still replace an older *pending* one in the same group, which is the
# behaviour we want.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # '1.10' is the current LTS; '1' tracks the latest stable release.
        # Julia 1.11 is unmaintained, so it is deliberately not covered.
        include:
          - {julia-version: '1.10', os: ubuntu-latest}
          - {julia-version: '1',    os: ubuntu-latest}
          - {julia-version: '1',    os: macOS-latest}
          - {julia-version: '1',    os: windows-latest}

    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  validation:
    name: Validation suite (cross-code references)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      # Runs against the tracked reference data in docs/dev/validation/;
      # no external code (Quanty, QuSpin) is executed.
      - name: Run validation suite
        run: julia --project=. --color=yes test/validation_runtests.jl
