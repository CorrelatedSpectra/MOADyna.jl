version: 2

# CompatHelper is in maintenance mode and now points users at Dependabot,
# which supports Julia (>= 1.10). One mechanism covers both the package
# [compat] bounds and the GitHub Actions versions.
updates:
  - package-ecosystem: julia
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "compat"
    ignore:
      # Optim 2.x no longer provides Optim.only_fg!, used by MOADynaOptimExt.
      # Re-enable once the extension is migrated and tested against 2.x.
      - dependency-name: "Optim"
        versions: [">=2"]
        update-types: ["version-update:semver-major"]

  - package-ecosystem: julia
    directory: "/docs"
    schedule:
      interval: weekly
    commit-message:
      prefix: "compat(docs)"
    ignore:
      # Documentation builds use the current checkout through Pkg.develop.
      - dependency-name: "MOADyna"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
